<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Portal do Caos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon">🗳️</span>
      Portal do <span class="logo-highlight">Caos</span>
    </a>
    <nav>
      <a href="index.html">Login</a>
      <a href="cadastro.html" class="active">Cadastro</a>
    </nav>
  </header>

  <main class="auth-layout">
    <div class="auth-visual">
      <h2>Junte-se ao<br>Caos Total</h2>
      <p>Crie sua conta e escolha seu lado (ou fique neutro, tanto faz).</p>
      <div class="candidate-row">
        <div class="candidate-thumb">
          <img src="img/lula.jpg" alt="Lula" onerror="this.style.display='none';this.nextElementSibling.textContent='🧔'">
          <span>Lula</span>
        </div>
        <div class="candidate-thumb">
          <img src="img/bolsonaro.jpg" alt="Bolsonaro" onerror="this.style.display='none';this.nextElementSibling.textContent='🤷'">
          <span>Bolsonaro</span>
        </div>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-card">
        <h1>Criar Conta</h1>
        <p class="subtitle">Preencha seus dados pra entrar na bagunça</p>

        <form onsubmit="return false;">
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome (ou codinome)" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>
            <div class="form-group">
              <label for="confirmar">Confirmar senha</label>
              <input type="password" id="confirmar" placeholder="Repita a senha" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" onclick="cadastrar()">
            Cadastrar ✅
          </button>
        </form>

        <div class="auth-footer">
          Já tem conta? <a href="index.html">Voltar ao login</a>
        </div>

        <p class="auth-meme">"Seus dados são mais protegidos que o sigilo eleitoral."</p>
      </div>
    </div>
  </main>

  <script>
    function cadastrar() {
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;

      if (!nome || !email || !senha || !confirmar) {
        alert('Preencha todos os campos, pô!');
        return;
      }
      if (!email.includes('@')) {
        alert('E-mail inválido! Cadê o @?');
        return;
      }
      if (senha.length < 3) {
        alert('Senha muito curta! Coloca pelo menos 3 caracteres.');
        return;
      }
      if (senha !== confirmar) {
        alert('As senhas não conferem! Tá igual promessa de político.');
        return;
      }

      localStorage.setItem('nome', nome);
      localStorage.setItem('email', email);
      alert('Conta criada com sucesso!');
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
